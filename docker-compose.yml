version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: querymind_postgres
    environment:
      POSTGRES_DB: querymind
      POSTGRES_USER: querymind
      POSTGRES_PASSWORD: querymind_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: querymind_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: querymind_api
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
    environment:
      - APP_ENV=development
      - DEBUG=True
      - DATABASE_URL=postgresql+asyncpg://querymind:querymind_dev@postgres:5432/querymind
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
      - qdrant
    restart: unless-stopped

volumes:
  pgdata:
  qdrant_data:
