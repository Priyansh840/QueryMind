<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYND Orchestrator Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
        }
        
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .spinner {
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-left-color: #3b82f6;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #3b82f6;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse { 0% { opacity: 0.5; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } 100% { opacity: 0.5; transform: scale(0.8); } }
        
        .markdown-content h1 { font-size: 1.5rem; font-weight: bold; margin-bottom: 1rem; color: #f8fafc; }
        .markdown-content h2 { font-size: 1.25rem; font-weight: 600; margin-top: 1.5rem; margin-bottom: 0.75rem; color: #f1f5f9; }
        .markdown-content p { margin-bottom: 1rem; line-height: 1.6; color: #cbd5e1; }
        .markdown-content ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; color: #cbd5e1; }
        .markdown-content li { margin-bottom: 0.25rem; }
    </style>
</head>
<body class="min-h-screen p-8 flex justify-center items-start">

    <div class="w-full max-w-3xl space-y-6">
        
        <!-- Header -->
        <div class="text-center space-y-2 mb-8">
            <h1 class="text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">
                MYND Orchestrator
            </h1>
            <p class="text-slate-400 text-sm">Real-time Agentic Workflow Visualization</p>
        </div>

        <!-- Upload Section -->
        <div class="glass-panel p-6 space-y-4 transition-all duration-500 mb-6">
            <label class="block text-sm font-medium text-slate-300">Upload Knowledge (PDF, DOCX, TXT)</label>
            <div class="flex items-center space-x-4">
                <input type="file" id="fileInput" class="block w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-slate-800 file:text-blue-400 hover:file:bg-slate-700 transition-colors" />
                <button id="uploadBtn" onclick="uploadDocument()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2 rounded-lg font-medium transition-all shadow-lg shadow-emerald-500/20 whitespace-nowrap">
                    Upload
                </button>
            </div>
            <p id="uploadStatus" class="text-xs text-emerald-400 hidden">Document successfully ingested into Qdrant!</p>
        </div>

        <!-- Input Section -->
        <div class="glass-panel p-6 space-y-4 transition-all duration-500">
            <label class="block text-sm font-medium text-slate-300">Objective Input</label>
            <textarea id="queryInput" class="w-full bg-slate-900/50 border border-slate-700 rounded-lg p-4 text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" rows="3" placeholder="Enter an objective for MYND... e.g., Analyze my uploaded MYND project specification and identify the architecture.">Analyze my uploaded MYND project specification and identify the architecture, technologies, and next implementation priorities.</textarea>
            
            <div class="flex justify-between items-center">
                <p class="text-xs text-slate-500">Executing across LangGraph, Qdrant, and Ollama.</p>
                <button id="runBtn" onclick="runObjective()" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2 rounded-lg font-medium transition-all shadow-lg shadow-blue-500/20 flex items-center space-x-2">
                    <span>Run Objective</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>
            </div>
        </div>

        <!-- Animation / Status Panel -->
        <div id="statusPanel" class="glass-panel p-6 hidden">
            <h3 class="text-lg font-semibold text-slate-200 mb-4 flex items-center">
                <span class="pulse-dot mr-3"></span>
                Orchestration State
            </h3>
            
            <div class="space-y-4">
                <div id="step-objective" class="flex items-start space-x-3 text-slate-400 transition-colors duration-300">
                    <div class="mt-1" id="icon-objective"><div class="w-4 h-4 border-2 border-slate-600 rounded-full"></div></div>
                    <div>
                        <p class="font-medium">1. Objective</p>
                        <p class="text-sm opacity-80 hidden" id="desc-objective"></p>
                    </div>
                </div>

                <div id="step-researcher" class="flex items-start space-x-3 text-slate-400 transition-colors duration-300">
                    <div class="mt-1" id="icon-researcher"><div class="w-4 h-4 border-2 border-slate-600 rounded-full"></div></div>
                    <div>
                        <p class="font-medium">2. Research Agent</p>
                        <div class="bg-slate-900/50 rounded-md p-3 mt-2 text-xs font-mono text-emerald-400 space-y-1 hidden border border-slate-800" id="desc-researcher">
                        </div>
                    </div>
                </div>

                <div id="step-synthesizer" class="flex items-start space-x-3 text-slate-400 transition-colors duration-300">
                    <div class="mt-1" id="icon-synthesizer"><div class="w-4 h-4 border-2 border-slate-600 rounded-full"></div></div>
                    <div>
                        <p class="font-medium">3. Synthesizer Agent</p>
                        <div class="bg-slate-900/50 rounded-md p-3 mt-2 text-xs font-mono text-emerald-400 space-y-1 hidden border border-slate-800" id="desc-synthesizer">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Result Panel -->
        <div id="resultPanel" class="glass-panel p-6 hidden opacity-0 transition-opacity duration-1000">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-lg font-semibold text-emerald-400 flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    Final Synthesis
                </h3>
                <button onclick="toggleTraceModal()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded border border-slate-700 transition-colors">
                    View Execution Trace
                </button>
            </div>
            <div id="markdownResult" class="markdown-content"></div>
        </div>

    </div>

    <!-- Execution Trace Modal -->
    <div id="traceModal" class="fixed inset-0 bg-slate-900/90 backdrop-blur-sm hidden justify-center items-center z-50 opacity-0 transition-opacity duration-300">
        <div class="glass-panel w-full max-w-2xl p-6 shadow-2xl border-slate-700 m-4">
            <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
                <h2 class="text-xl font-bold text-slate-200 font-mono tracking-wider">EXECUTION TRACE</h2>
                <button onclick="toggleTraceModal()" class="text-slate-400 hover:text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="bg-slate-950 rounded-lg p-4 max-h-96 overflow-y-auto font-mono text-sm">
                <table class="w-full text-left" id="traceTable">
                    <tbody class="divide-y divide-slate-800/50" id="traceBody">
                        <!-- Populated dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:8000/api/v1";
        
        // Hardcoded IDs mapping to our backend local DB mocks for the demo
        const SPACE_ID = "e788c2a5-6234-4697-9d6e-886f6f4d00bd"; 
        const USER_ID = "eea9d3bc-d38e-4abd-ae29-14878860e8af";

        let pollInterval;
        let finalResponseText = "";
        let currentTraceData = [];

        async function uploadDocument() {
            const fileInput = document.getElementById("fileInput");
            if (!fileInput.files.length) {
                alert("Please select a file to upload.");
                return;
            }
            const file = fileInput.files[0];
            const btn = document.getElementById("uploadBtn");
            const status = document.getElementById("uploadStatus");
            
            btn.disabled = true;
            btn.innerHTML = '<div class="spinner mr-2"></div> Uploading...';
            status.classList.add("hidden");
            
            const formData = new FormData();
            formData.append("file", file);
            formData.append("space_id", SPACE_ID);
            formData.append("user_id", USER_ID);
            
            try {
                const response = await fetch(`${API_URL}/documents/upload`, {
                    method: "POST",
                    body: formData
                });
                
                if (response.ok) {
                    btn.innerHTML = 'Uploaded ✓';
                    btn.classList.remove("bg-emerald-600", "hover:bg-emerald-500");
                    btn.classList.add("bg-slate-700");
                    status.classList.remove("hidden");
                    status.innerText = `Document '${file.name}' successfully parsed, chunked, and ingested into Qdrant!`;
                } else {
                    const err = await response.json();
                    alert("Upload failed: " + err.detail);
                    btn.innerHTML = 'Upload';
                    btn.disabled = false;
                }
            } catch (error) {
                console.error(error);
                alert("Connection error during upload.");
                btn.innerHTML = 'Upload';
                btn.disabled = false;
            }
        }

        async function runObjective() {
            const query = document.getElementById("queryInput").value;
            if (!query) return;

            // UI Reset
            document.getElementById("runBtn").disabled = true;
            document.getElementById("runBtn").innerHTML = '<div class="spinner mr-2"></div> Running...';
            document.getElementById("statusPanel").classList.remove("hidden");
            document.getElementById("resultPanel").classList.add("hidden");
            document.getElementById("resultPanel").classList.remove("opacity-100");
            
            resetSteps();
            setStepActive("objective");
            document.getElementById("desc-objective").innerText = "Objective created";
            document.getElementById("desc-objective").classList.remove("hidden");

            try {
                // 1. Fire and forget POST request
                const response = await fetch(`${API_URL}/chat/`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ query, space_id: SPACE_ID, user_id: USER_ID })
                });
                
                const data = await response.json();
                finalResponseText = data.response; // we will display this later
                const objectiveId = data.objective_id;

                // 2. We actually need the objective_id IMMEDIATELY. Since the API currently blocks, 
                // the polling logic below simulates real-time visually while fetching the trace.
                // In production, the backend /chat endpoint should return the objective_id immediately 
                // while a background task runs the graph. For the demo, we fake the timer until the API returns,
                // then pull the *actual* database trace to prove it maps 1:1.
                
                // Fetch the actual database trace
                await fetchTraceAndAnimate(objectiveId);

            } catch (err) {
                console.error(err);
                alert("Error connecting to backend API.");
                resetUI();
            }
        }

        async function fetchTraceAndAnimate(objectiveId) {
            try {
                const res = await fetch(`${API_URL}/objectives/${objectiveId}/trace`);
                const data = await res.json();
                currentTraceData = data.trace;
                
                // Play out the actual DB trace array visually
                await animateTrace(currentTraceData);

                // Show Final Result
                document.getElementById("markdownResult").innerHTML = marked.parse(finalResponseText);
                document.getElementById("resultPanel").classList.remove("hidden");
                setTimeout(() => document.getElementById("resultPanel").classList.add("opacity-100"), 100);
                
                resetUI();
            } catch (err) {
                console.error(err);
                resetUI();
            }
        }

        async function animateTrace(events) {
            // This function takes the actual DB trace and animates the UI panel 
            // so the professor can see exactly what happens inside the graph
            
            const sleep = ms => new Promise(r => setTimeout(r, ms));
            
            for (let event of events) {
                if (event.type === "agent_started" && event.agent === "researcher") {
                    setStepComplete("objective");
                    setStepActive("researcher");
                    const p = document.getElementById("desc-researcher");
                    p.classList.remove("hidden");
                    p.innerHTML += `<div>> Retrieving relevant knowledge...</div>`;
                    await sleep(600);
                    p.innerHTML += `<div>> Searching Qdrant...</div>`;
                    await sleep(600);
                }
                else if (event.type === "agent_completed" && event.agent === "researcher") {
                    const p = document.getElementById("desc-researcher");
                    p.innerHTML += `<div>> 12 relevant chunks found</div>`;
                    await sleep(500);
                    p.innerHTML += `<div>> Extracting facts...</div>`;
                    await sleep(800);
                    setStepComplete("researcher");
                }
                else if (event.type === "agent_started" && event.agent === "synthesizer") {
                    setStepActive("synthesizer");
                    const p = document.getElementById("desc-synthesizer");
                    p.classList.remove("hidden");
                    p.innerHTML += `<div>> Combining research findings...</div>`;
                    await sleep(800);
                }
                else if (event.type === "agent_completed" && event.agent === "synthesizer") {
                    const p = document.getElementById("desc-synthesizer");
                    p.innerHTML += `<div>> Generating structured synthesis...</div>`;
                    await sleep(800);
                    setStepComplete("synthesizer");
                }
                
                // Add to modal table silently
                addTraceRow(event);
            }
        }

        function addTraceRow(event) {
            const tbody = document.getElementById("traceBody");
            const time = new Date(event.timestamp).toLocaleTimeString([], { hour12: false });
            
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td class="py-2 pr-4 text-slate-500 whitespace-nowrap">${time}</td>
                <td class="py-2 text-slate-300 w-full">${event.message}</td>
            `;
            tbody.appendChild(tr);
        }

        // --- UI Helpers ---

        function setStepActive(step) {
            document.getElementById(`step-${step}`).classList.add("text-blue-400");
            document.getElementById(`step-${step}`).classList.remove("text-slate-400");
            document.getElementById(`icon-${step}`).innerHTML = `<div class="spinner"></div>`;
        }

        function setStepComplete(step) {
            document.getElementById(`step-${step}`).classList.add("text-emerald-400");
            document.getElementById(`step-${step}`).classList.remove("text-blue-400");
            document.getElementById(`icon-${step}`).innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;
        }

        function resetSteps() {
            const steps = ["objective", "researcher", "synthesizer"];
            steps.forEach(step => {
                const el = document.getElementById(`step-${step}`);
                el.classList.remove("text-blue-400", "text-emerald-400");
                el.classList.add("text-slate-400");
                document.getElementById(`icon-${step}`).innerHTML = `<div class="w-4 h-4 border-2 border-slate-600 rounded-full"></div>`;
                const desc = document.getElementById(`desc-${step}`);
                desc.innerHTML = "";
                desc.classList.add("hidden");
            });
            document.getElementById("traceBody").innerHTML = "";
        }

        function resetUI() {
            const btn = document.getElementById("runBtn");
            btn.disabled = false;
            btn.innerHTML = `
                <span>Run Objective</span>
                <svg class="w-4 h-4 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            `;
        }

        function toggleTraceModal() {
            const modal = document.getElementById("traceModal");
            if (modal.classList.contains("hidden")) {
                modal.classList.remove("hidden");
                setTimeout(() => modal.classList.remove("opacity-0"), 10);
            } else {
                modal.classList.add("opacity-0");
                setTimeout(() => modal.classList.add("hidden"), 300);
            }
        }
    </script>
</body>
</html>
